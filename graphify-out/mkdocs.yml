site_name: yogamann
site_description: Knowledge graph wiki for the yogamann pose analysis pipeline
docs_dir: wiki
site_dir: mkdocs-out

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Core Pipeline:
    - VLM Inference Core: vlm-inference-core.md
    - Batch Orchestration: batch-orchestration.md
    - Single-Run Analyzer: single-run-analyzer.md
    - Mannequin Generator: mannequin-generator.md
    - Contact Sheet Builder: contact-sheet-builder.md
  - Data & Storage:
    - Database — Queries: database-queries.md
    - DB Thumbnails & Fixtures: db-thumbnail-fixtures.md
  - User Interfaces:
    - Review Gallery UI: review-gallery-ui.md
    - Static Gallery Builder: static-gallery-builder.md
  - Research & Design:
    - Architecture Decisions & ADRs: architecture-decisions.md
    - VLM Model Registry: vlm-model-registry.md
    - Pose Pipeline Research: pose-pipeline-research.md
    - Pose Estimator Alternatives: pose-estimator-alternatives.md
    - GPU Stability: gpu-stability.md
  - Infrastructure:
    - Batch Utilities: batch-utilities.md
    - Batch Lock: batch-lock.md
    - Windows Job Objects: windows-job-objects.md
    - Progress Monitor: progress-monitor.md
    - Batch Runner Script: batch-runner-script.md
    - RTX 5080 Diagnostics: rtx5080-diagnostics.md
  - Feature Plans:
    - Fast Model Download: fast-model-download.md
    - Gallery Thumbnails Fix: gallery-thumbnails-fix.md
    - ControlNet Strength Sweep: controlnet-strength-sweep.md
