# ── yogamann reproducible environment ─────────────────────────────────
#   conda env create -f environment.yml
#   conda activate yogamann
#   conda env update  -f environment.yml        # bring an existing env up‑to‑date
# ---------------------------------------------------------------------

name: yogamann
channels:
  - pytorch        # official PyTorch + CUDA wheels
  - conda-forge    # everything else
dependencies:
  # ── core runtime ────────────────────────────────────────────────────
  - python=3.10                           # MediaPipe still limited to <=3.11
  - pytorch=2.3.1                         # builds come with cu118 CUDA libs
  - torchvision=0.18.1
  - torchaudio=2.3.1
  # ── computer‑vision utilities ───────────────────────────────────────
  - opencv                                # pose detection / image IO
  - pillow                                # PNG metadata + general imaging
  - numpy                                 # basic maths
  - timm                                  # Tiny‑ViT backbones for ControlNet
  # ── allow PyPI extras below ─────────────────────────────────────────
  - pip
  - pip:
      - diffusers==0.34.0      # matches code in sd_make.py
      - transformers==4.41.*   # 4.41.2 at the time of writing
      - safetensors>=0.3.1
      - huggingface-hub>=0.33
      - accelerate             # quiets diffusers “install accelerate” warning
      - mediapipe              # 3‑D pose estimation
      - controlnet_aux>=0.0.8  # open‑pose wrapper
      # - xformers==0.0.37.post1  # optional – build/​install only if desired
