active_model: qwen2_5_vl_7b
active_prompt: v1

models:
  qwen2_5_vl_7b:
    repo: Qwen/Qwen2.5-VL-7B-Instruct
    backend: transformers
    load_in_4bit: true
    max_new_tokens: 256        # JSON output is ~60-100 tokens; 512 wastes budget on bad retries
    max_pixels: 401408         # 512 patches × 784px/patch — ~2× faster vs default 1M-pixel cap
    vlm_batch_size: 1          # batch=2 tested: 16GB VRAM insufficient headroom; revisit on 24GB+

  internvl2_5_8b:
    repo: OpenGVLab/InternVL2_5-8B-MPO
    backend: transformers
    inference_style: internvl   # uses model.chat() — not processor + generate
    load_in_4bit: true
    max_new_tokens: 512
    # revision: <commit-hash>

  # MiniCPM-o-2.6 is the omni-modal sibling of MiniCPM-V-2.6 (adds audio + TTS).
  # Previously blocked on transformers 4.49.0: bnb 4-bit + native Qwen2 _init_weights
  # crashed with NotImplementedError on uint8 tensors. Now unblocked via the
  # _patch_qwen2_init_weights_for_bnb() patch in src/vlm_inference.py — applied at
  # module load, no-op for already-working Qwen2 models. See ADR-003 for the full
  # diagnosis + resolution.
  minicpm_o_2_6:
    repo: openbmb/MiniCPM-o-2_6
    backend: transformers
    inference_style: minicpm_v   # sibling of MiniCPM-V; same model.chat(image=None, msgs=[...], tokenizer=) API
    load_in_4bit: true
    max_new_tokens: 512

  minicpm_v_2_6:
    repo: openbmb/MiniCPM-V-2_6
    backend: transformers
    inference_style: minicpm_v   # model.chat(image=None, msgs=[...], tokenizer=)
    load_in_4bit: true
    max_new_tokens: 512
    # revision: <commit-hash>

  molmo_7b_d:
    repo: allenai/Molmo-7B-D-0924
    backend: transformers
    inference_style: molmo   # uses processor.process + model.generate_from_batch
    load_in_4bit: true
    max_new_tokens: 512
    # revision: <commit-hash>

prompts:
  v1:
    system: |
      You are a pose-matching accuracy analyst. You receive two images:
      Image 1: a source photo of a person in a yoga pose.
      Image 2: a 3D wooden mannequin render meant to replicate that exact pose.
      Your sole task is to judge how accurately the mannequin replicates the human body position.
      Do NOT evaluate pose quality, difficulty, naturalness, or relaxation of the human.
      Do NOT comment on clothing, skin, background, or artistic style.
      Output ONLY valid JSON — no prose, no markdown, no explanation outside the JSON.
    user: |
      Does the mannequin in Image 2 match the body position shown in Image 1?
      Focus exclusively on joint angles, limb positions, and weight distribution.

      Output JSON with exactly these keys:
        rating            — "good" (pose closely replicated), "acceptable" (minor joint divergence), or "poor" (significant mismatch)
        misaligned        — list of specific body-part discrepancies (e.g. ["left elbow too straight", "right hip rotated forward"]). Empty list if none.
        unwanted_features — list of render artifacts unrelated to pose (e.g. ["floating limb", "geometry clipping"]). Empty list if none.
        fail_patterns     — list of systematic render issues (e.g. ["torso consistently tilted right vs source"]). Empty list if none.
        notes             — one sentence: overall match quality and the single most critical discrepancy, if any.

  v2_checklist:
    system: |
      You are a pose-matching accuracy analyst. You receive two images:
      Image 1: a source photo of a person in a yoga pose.
      Image 2: a 3D wooden mannequin render meant to replicate that exact pose.
      Your sole task is to judge how accurately the mannequin replicates the human body position.

      DO NOT evaluate or comment on: facial expression, face, hair, clothing, skin, background,
      lighting, artistic style, realism, safety, injury risk, pose difficulty, or naturalness.

      BEFORE assigning a rating, verify EACH of the following body parts in order:
        1. Head tilt (forward/back/side)
        2. Neck rotation
        3. Shoulder elevation and rotation (left and right)
        4. Elbow angle (left and right)
        5. Wrist and hand position, finger spread (left and right)
        6. Torso lean and twist
        7. Hip angle and rotation (left and right)
        8. Knee angle (left and right)
        9. Ankle and foot position (left and right)

      Output ONLY valid JSON — no prose, no markdown, no explanation outside the JSON.
    user: |
      Does the mannequin in Image 2 match the body position shown in Image 1?

      For each body part below, verify the match before assigning an overall rating:
        head tilt, neck rotation, shoulder elevation + rotation, elbow angle,
        wrist/hand/finger spread, torso lean/twist, hip angle + rotation,
        knee angle, ankle/foot position.

      Rating criteria (apply strictly — do not default to "good"):
        "good"       — ALL major body parts match closely; only minor sub-joint differences allowed
        "acceptable" — most major parts match; up to 2 joints with noticeable divergence
        "poor"       — 3 or more major parts significantly misaligned

      Output JSON with exactly these keys:
        rating            — "good", "acceptable", or "poor"
        misaligned        — list of specific body-part discrepancies (e.g. ["left elbow too straight", "right hip rotated forward"]). Empty list if none.
        unwanted_features — list of render artifacts unrelated to pose (e.g. ["floating limb", "geometry clipping"]). Empty list if none.
        fail_patterns     — list of systematic render issues (e.g. ["torso consistently tilted right vs source"]). Empty list if none.
        notes             — one sentence: overall match quality and the single most critical discrepancy, if any.

schema:
  rating: [good, acceptable, poor]
  required: [rating, misaligned, unwanted_features, fail_patterns, notes]
