# Profile: warrior_lora_sweep
profile_version: 2.0

versions: 3      # generate exactly three variants
random  : false  # LINEAR interpolation across ranges

# Looser prompt so the LoRA can style the output
prompt: |
  wooden mannequin, warrior II yoga pose, studio grey backdrop
neg_prompt: extra limbs, low detail

# Swept parameters
cond_scale : [1.0, 1.6]   # produces 1.0, 1.3, 1.6
guidance   : [5.5, 7.5]   # produces 5.5, 6.5, 7.5
steps      : 30           # constant

# Fix seed so only the numeric knobs vary
seed: 123

# LoRA / additional model settings  (not yet wired in code)
lora:
  file: models/lora/wood_grain_texture.lora.safetensors
  weight: 0.65
