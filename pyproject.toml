[project]
name = "yogamann"
version = "0.1.0"
description = "Yoga pose photo to wooden artist mannequin generator"
requires-python = ">=3.13"
dependencies = [
    # diffusion pipeline
    "diffusers>=0.29.0",
    # transformers pinned to 4.49.0 — see docs/architecture-decisions.md ADR-001
    # and ADR-002. v4.49 is the floor (Qwen2.5-VL requires it) and the ceiling
    # (>=4.50 breaks InternVL/MiniCPM-V/Molmo via PreTrainedModel refactors).
    "transformers==4.49.0",
    "safetensors>=0.3.1",
    "huggingface-hub>=0.33",
    "accelerate",
    # pose detection + ControlNet helpers (DWPose uses ONNX internally)
    "controlnet_aux>=0.0.8",
    "onnxruntime-gpu",
    # vision utilities
    "opencv-python",
    "pillow",
    "timm",
    "numpy",
    # config
    "pyyaml",
    "psutil>=5.9",
    # torch — pulled from nightly cu130 index below
    "torch",
    "torchvision",
    "hf-transfer>=0.1.9",
    "rtmlib>=0.0.15",
    "matplotlib>=3.10.9",
    # review gallery
    "streamlit>=1.37",
    "bitsandbytes>=0.45",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true   # only consulted for packages listed in [tool.uv.sources]

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
