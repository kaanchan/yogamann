[project]
name = "yogamann"
version = "0.1.0"
description = "Yoga pose photo to wooden artist mannequin generator"
requires-python = ">=3.13"
dependencies = [
    # diffusion pipeline
    "diffusers>=0.29.0",
    "transformers>=4.41",
    "safetensors>=0.3.1",
    "huggingface-hub>=0.33",
    "accelerate",
    # pose detection + ControlNet helpers (DWPose uses ONNX internally)
    "controlnet_aux>=0.0.8",
    "onnxruntime-gpu",
    # vision utilities
    "opencv-python",
    "pillow",
    "timm",
    "numpy",
    # config
    "pyyaml",
    # torch — pulled from nightly cu130 index below
    "torch",
    "torchvision",
]

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true   # only consulted for packages listed in [tool.uv.sources]

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }
